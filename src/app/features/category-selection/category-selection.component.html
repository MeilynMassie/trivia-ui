<div class="min-h-screen bg-slate-100 px-4 py-12">
  <div class="mx-auto max-w-md rounded-2xl bg-white p-8 shadow-xl ring-1 ring-slate-200">
    <div class="mb-6">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-violet-600">Trivia</p>
      <h2 class="mt-2 text-3xl font-bold text-slate-900">Select a category</h2>
    </div>

    @if (loading()) {
      <div class="flex justify-center py-8">
        <app-loading-spinner />
      </div>
    }

    @if (!loading() && categories().length === 0) {
      <p class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700">
        No categories found. Please reload.
      </p>
    }

    @if (!loading() && categories().length > 0) {
      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div class="space-y-2">
          <label for="category" class="block text-sm font-medium text-slate-700">Category</label>
          <select
            id="category"
            name="category"
            [(ngModel)]="selectedCategory"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-900 shadow-sm outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200"
          >
            <option value="" disabled>Select a category</option>
            @for (c of categories(); track c) {
              <option [value]="c">{{ c }}</option>
            }
          </select>
        </div>

        <button
          type="submit"
          [disabled]="!selectedCategory"
          class="w-full rounded-xl bg-violet-600 px-4 py-3 font-semibold text-white transition hover:bg-violet-700 disabled:cursor-not-allowed disabled:bg-slate-300"
        >
          Start quiz
        </button>
      </form>
    }
  </div>
</div>
